version: 2
updates:
  # Keep npm dependencies patched — groups minor/patch bumps into one PR per
  # week and opens security-fix PRs immediately regardless of schedule.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Backend is a separate npm package (its own package.json/lockfile) — the root
  # entry above never sees it, so it needs its own entry.
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Keep the Docker base images (node:20-alpine, nginx:alpine) patched too.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "weekly"
