server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (mirrors vercel.json for the Docker/nginx deploy path).
    # connect-src includes http://localhost:5050 because this file only ever serves the
    # LOCAL docker-compose flow (see docker-compose.yaml's "5050:5000" port mapping) —
    # this is never the real production path (that's Vercel), so a local-only origin
    # here is intentional, not a leftover to clean up before deploying.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://picsum.photos data:; connect-src 'self' http://localhost:5050; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    # No directory listing, and deny any dotfile (.env, .git, etc.) that
    # somehow ended up in the served root.
    autoindex off;
    location ~ /\. {
        deny all;
    }

    # SPA fallback — unknown routes serve index.html instead of nginx's 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}